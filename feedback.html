<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback — Innoloom</title><link rel="stylesheet" href="css/styles.css"></head>
<body data-page="feedback"><header id="site-header"></header><main class="auth-shell"><section class="auth-card"><p class="eyebrow">Feedback</p><h1>Help us improve.</h1><p class="muted">Send a suggestion, report an issue, or tell us what would make the learning experience better.</p><form id="feedback-form" novalidate><div class="form-group"><label>Topic</label><input id="feedback-topic" required maxlength="120"><small class="field-error"></small></div><div class="form-group"><label>Your feedback</label><textarea id="feedback-text" rows="7" required minlength="10" maxlength="1000"></textarea><small class="field-error"></small></div><button class="btn btn-primary" type="submit">Submit</button><p id="feedback-message" class="form-message"></p></form></section></main><footer id="site-footer"></footer><script src="js/app.js"></script></body></html>
